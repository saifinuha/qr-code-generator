<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Studio — Professional QR Code Generator</title>
    <meta name="description" content="Create beautiful, customized QR codes for links, text, WiFi, and vCards with ease.">
    <link rel="icon" type="image/png" href="build/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body data-theme="dark">
    <script>
        if (window.process && window.process.type === 'renderer') {
            document.body.classList.add('electron-env');
        }
    </script>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box">
                    <i class="ri-qr-code-line"></i>
                    <div class="logo-text">
                        <span class="brand">QR CODE</span>
                        <span class="sub-brand">STUDIO</span>
                    </div>
                </div>
            </div>
            
            <nav class="nav-menu">
                <button class="nav-item active" data-type="url">
                    <i class="ri-link"></i>
                    <span>Link</span>
                </button>
                <button class="nav-item" data-type="text">
                    <i class="ri-edit-line"></i>
                    <span>Text</span>
                </button>
                <button class="nav-item" data-type="wifi">
                    <i class="ri-wifi-line"></i>
                    <span>WiFi</span>
                </button>
                <button class="nav-item" data-type="vcard">
                    <i class="ri-user-line"></i>
                    <span>vCard</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="nav-item collapse-btn" id="sidebar-toggle" title="Toggle Sidebar">
                    <i class="ri-side-bar-line"></i>
                    <span>Collapse</span>
                </button>
                <button class="nav-item settings-btn" id="theme-toggle">
                    <i class="ri-moon-line"></i>
                    <span>Theme</span>
                </button>
                <div class="author-info">
                    <span>Made with <i class="ri-heart-3-line"></i> by saifinuha</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Mobile Header (Visible only on small screens) -->
            <div class="mobile-top-bar">
                <div class="mobile-logo">
                    <i class="ri-qr-code-line"></i>
                    <span>QR STUDIO</span>
                </div>
                <button class="theme-toggle-mobile" id="theme-toggle-mobile">
                    <i class="ri-moon-line"></i>
                </button>
            </div>

            <div class="content-wrapper">
                <header class="content-header">
                    <h1 id="current-type-title">LINK</h1>
                    <p id="current-type-subtitle">Generate QR for URL</p>
                </header>

                <div class="split-view">
                    <!-- Editor Area -->
                    <section class="editor-section">
                        <div class="input-container" id="input-fields">
                            <!-- Dynamic fields -->
                        </div>

                        <div class="style-options">
                            <div class="option-group">
                                <label>Style</label>
                                <div class="segmented-control" id="dot-style-selector">
                                    <button class="segment active" data-value="square">Classic</button>
                                    <button class="segment" data-value="rounded">Rounded</button>
                                    <button class="segment" data-value="dots">Dot</button>
                                </div>
                            </div>

                            <div class="option-group">
                                <label>Main Color</label>
                                <div class="color-picker-wrapper" id="dots-color-wrapper">
                                    <input type="color" id="dots-color" value="#ffffff">
                                    <div class="color-preview-gradient"></div>
                                </div>
                            </div>

                            <div class="option-group">
                                <label>Corner Color</label>
                                <div class="color-picker-wrapper" id="corners-color-wrapper">
                                    <input type="color" id="corners-color" value="#ffffff">
                                    <div class="color-preview-gradient"></div>
                                </div>
                            </div>

                            <div class="option-group">
                                <label>Outer Corners</label>
                                <div class="segmented-control" id="corner-square-selector">
                                    <button class="segment active" data-value="square">Square</button>
                                    <button class="segment electron-only" data-value="rounded">Rounded</button>
                                    <button class="segment" data-value="extra-rounded">Extra Rounded</button>
                                    <button class="segment" data-value="dot">Circle</button>
                                </div>
                            </div>

                            <div class="option-group">
                                <label>Inner Corners</label>
                                <div class="segmented-control" id="corner-dot-selector">
                                    <button class="segment" data-value="square">Square</button>
                                    <button class="segment electron-only" data-value="rounded">Rounded</button>
                                    <button class="segment electron-only" data-value="extra-rounded">Extra</button>
                                    <button class="segment active" data-value="dot">Dot</button>
                                </div>
                            </div>

                            <div class="option-group">
                                <label>Logo</label>
                                <div class="logo-actions">
                                    <button class="btn secondary upload-btn" id="logo-trigger">
                                        Upload Logo
                                    </button>
                                    <div class="logo-preview-box" id="logo-preview">
                                    </div>
                                    <button class="btn icon-btn reset-btn" id="logo-reset" title="Remove Logo">
                                        <i class="ri-delete-bin-line"></i>
                                    </button>
                                    <input type="file" id="logo-input" accept="image/*" hidden>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Preview Area -->
                    <section class="preview-section">
                        <div class="qr-container">
                            <div id="qr-preview"></div>
                        </div>
                        <p class="scan-hint">Scan to Test</p>
                        
                        <div class="footer-actions">
                            <p class="download-label">Download QR Code</p>
                            <div class="button-group">
                                <button id="btn-export-png" class="btn primary main-action">
                                    Save QR
                                </button>
                                <button class="btn icon-btn" title="Share">
                                    <i class="ri-share-line"></i>
                                    <span>Share</span>
                                </button>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
